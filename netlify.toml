# ============================================================
# Netlify configuration — FIELD INSTRUMENTS
# Plain static HTML/CSS/JS. There is NO build step and NO bundler.
# ============================================================

[build]
  # The site is served straight from the repository root.
  publish = "."

  # Explicitly empty. package.json has no "build" script, so leaving a
  # default like `npm run build` in the dashboard fails the deploy with
  # "Missing script: build" and can publish an empty/partial directory.
  command = ""

# ------------------------------------------------------------
# NOTE: deliberately NO _redirects / /* /index.html 200 rule here.
# This app uses hash routing (#stars, #sound, ...), so deep links
# already work without a rewrite. A catch-all rewrite would make a
# MISSING styles/base.css return index.html with HTTP 200 instead of
# a 404, which hides exactly the class of bug we just fixed.
# ------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Styles and scripts are unversioned, so keep the cache short enough
# that a redeploy is visible immediately.
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
