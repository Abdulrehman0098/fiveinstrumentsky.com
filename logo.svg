<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8ecf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
    </linearGradient>
    <filter id="logo-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Icon mark -->
  <g transform="translate(8, 8)">
    <circle cx="32" cy="32" r="28" stroke="url(#logo-glow)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <line x1="32" y1="4" x2="32" y2="14" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="32" y1="50" x2="32" y2="60" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="4" y1="32" x2="14" y2="32" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="50" y1="32" x2="60" y2="32" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="32" cy="32" r="18" stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.4"/>
    <circle cx="32" cy="32" r="4" fill="#ffd700" filter="url(#logo-glow-filter)"/>
    <circle cx="32" cy="18" r="2" fill="#00f0ff" opacity="0.9"/>
    <circle cx="46" cy="32" r="2" fill="#00f0ff" opacity="0.9"/>
    <circle cx="32" cy="46" r="2" fill="#00f0ff" opacity="0.9"/>
    <circle cx="18" cy="32" r="2" fill="#00f0ff" opacity="0.9"/>
    <line x1="22" y1="22" x2="26" y2="26" stroke="#ffd700" stroke-width="0.75" opacity="0.6"/>
    <line x1="42" y1="22" x2="38" y2="26" stroke="#ffd700" stroke-width="0.75" opacity="0.6"/>
    <line x1="22" y1="42" x2="26" y2="38" stroke="#ffd700" stroke-width="0.75" opacity="0.6"/>
    <line x1="42" y1="42" x2="38" y2="38" stroke="#ffd700" stroke-width="0.75" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text x="80" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="url(#text-grad)">FIELD</text>
  <text x="80" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="6" fill="#00f0ff" opacity="0.8">INSTRUMENTS</text>
  <!-- Accent line -->
  <line x1="80" y1="66" x2="200" y2="66" stroke="url(#logo-glow)" stroke-width="1" opacity="0.4"/>
</svg>